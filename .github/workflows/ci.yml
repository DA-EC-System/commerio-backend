name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # static + test chia 3 phần: .github/workflows/test-suite.yml (dùng chung với deploy-staging.yml).
  suite:
    uses: ./.github/workflows/test-suite.yml

  # Giữ tên check cũ: PR xanh/đỏ ở một chỗ, đỏ khi static hoặc bất kỳ phần test nào không đạt.
  check:
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tổng hợp
        env:
          SUITE: ${{ needs.suite.result }}
        run: |
          echo "static + test (3 phần): $SUITE"
          if [ "$SUITE" != success ]; then
            echo "::error title=suite $SUITE::static hoặc một phần test không đạt, xem các job suite / … màu đỏ"
            exit 1
          fi

  # Bộ test hộp đen (#120, test/CLAUDE.md mục Hộp đen): gọi HTTP vào api thật dựng ngay trong runner.
  # DB là container tạm của job, mật khẩu seed ở đây không phải bí mật.
  blackbox:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: commerio
          POSTGRES_PASSWORD: commerio
          POSTGRES_DB: commerio
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U commerio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://commerio:commerio@localhost:5432/commerio
      SEED_PASSWORD: HopDenCI2026
      BLACKBOX_PASSWORD: HopDenCI2026
      BLACKBOX_BASE_URL: http://127.0.0.1:3000
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - name: Bật api
        run: |
          nohup npm start > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/health > /dev/null && exit 0
            sleep 1
          done
          cat api.log
          exit 1
      - run: npm run test:blackbox
      - name: Log của api
        if: failure()
        run: cat api.log

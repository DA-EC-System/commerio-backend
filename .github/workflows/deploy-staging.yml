# Staging (#37, Documents/21 D12, V36): merge vào develop → kiểm → image amd64 + arm64 lên GHCR
# → migration và seed từ runner lên Supabase → gắn tag develop → đổi image trên k3s của VPS (bỏ qua khi chưa có VPS).
# Secret và biến cần tạo: deploy/staging/README.md.
name: Deploy staging

on:
  push:
    branches: [develop]

# Mỗi lúc một lần deploy; lần mới chờ lần đang chạy xong, không huỷ giữa chừng (đang migrate).
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/da-ec-system/commerio-backend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Chạy từ runner vì image không có drizzle-kit và db/ (V36). Lỗi thì job đỏ, các job sau không chạy.
  migrate:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migration
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      - name: Dữ liệu demo P1
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          SEED_PASSWORD: ${{ secrets.STAGING_SEED_PASSWORD }}

  # Tag develop chỉ trỏ image đã có schema tương ứng trên staging.
  tag-develop:
    needs: [image, migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx imagetools create -t "$IMAGE:develop" "$IMAGE:${{ needs.image.outputs.tag }}"

  # Đổi image của api, worker, realtime trên k3s (deploy/k8s/overlays/vps). Bí mật của app (DB, JWT) nằm trong
  # overlays/vps/.env trên VPS, CI không gửi. Khoá SSH chỉ chạy được commerio-deploy backend (ci-deploy/setup.sh):
  # lệnh gửi đi chỉ là tag, VPS set image rồi chờ rollout xong. Chưa có VPS: biến STAGING_SSH_HOST trống nên job bị bỏ qua.
  deploy:
    needs: [image, tag-develop]
    if: vars.STAGING_SSH_HOST != ''
    runs-on: ubuntu-latest
    env:
      HOST: ${{ vars.STAGING_SSH_HOST }}
      SSH_USER: ${{ vars.STAGING_SSH_USER }}
    steps:
      - name: Khoá SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      - name: Đổi image trên k3s
        run: ssh "$SSH_USER@$HOST" "${{ needs.image.outputs.tag }}"

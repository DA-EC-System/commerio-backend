# Staging (#37, Documents/21 D12, V36): merge vào develop → kiểm → image amd64 + arm64 lên GHCR
# → migration và seed từ runner lên Supabase → gắn tag develop → deploy lên VPS (bỏ qua khi chưa có VPS).
# Secret và biến cần tạo: deploy/staging/README.md.
name: Deploy staging

on:
  push:
    branches: [develop]

# Mỗi lúc một lần deploy; lần mới chờ lần đang chạy xong, không huỷ giữa chừng (đang migrate).
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/da-ec-system/commerio-backend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Chạy từ runner vì image không có drizzle-kit và db/ (V36). Lỗi thì job đỏ, các job sau không chạy.
  migrate:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migration
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      - name: Dữ liệu demo P1
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          SEED_PASSWORD: ${{ secrets.STAGING_SEED_PASSWORD }}

  # Tag develop chỉ trỏ image đã có schema tương ứng trên staging.
  tag-develop:
    needs: [image, migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx imagetools create -t "$IMAGE:develop" "$IMAGE:${{ needs.image.outputs.tag }}"

  # Chưa có VPS: biến STAGING_SSH_HOST trống nên job bị bỏ qua (không đỏ).
  deploy:
    needs: [image, tag-develop]
    if: vars.STAGING_SSH_HOST != ''
    runs-on: ubuntu-latest
    env:
      HOST: ${{ vars.STAGING_SSH_HOST }}
      SSH_USER: ${{ vars.STAGING_SSH_USER }}
      DIR: /opt/commerio
    steps:
      - uses: actions/checkout@v5
      - name: Khoá SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      - name: Ghi .env của staging
        run: |
          umask 077
          # Nháy đơn: compose không nội suy '$' trong giá trị (mật khẩu có '$' vẫn đúng). PEM viết '\n' trên một dòng.
          put() {
            case "$2" in *"'"* | *$'\n'*) echo "::error::$1 không được chứa nháy đơn hay xuống dòng"; exit 1 ;; esac
            echo "$1='$2'"
          }
          {
            put IMAGE "$IMAGE"
            put IMAGE_TAG "${{ needs.image.outputs.tag }}"
            put SITE_ADDRESS "$SITE_ADDRESS"
            put FE_DIST "$DIR/site"
            put DATABASE_URL "$DATABASE_URL"
            put JWT_PRIVATE_KEY "$JWT_PRIVATE_KEY"
            put JWT_PUBLIC_KEY "$JWT_PUBLIC_KEY"
          } > deploy/staging/.env
        env:
          SITE_ADDRESS: ${{ vars.STAGING_SITE_ADDRESS }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          JWT_PRIVATE_KEY: ${{ secrets.STAGING_JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.STAGING_JWT_PUBLIC_KEY }}
      - name: Chép cấu hình lên VPS, kéo image và chạy
        # Biến cố ý mở rộng ở runner trước khi gửi qua ssh; scp -p giữ quyền 600 của .env.
        run: |
          # Biến repo được chèn vào lệnh chạy trên VPS: chỉ nhận tên tài khoản hợp lệ.
          [[ "$GHCR_USER" =~ ^[A-Za-z0-9-]+$ ]] || { echo "::error::STAGING_GHCR_USER không hợp lệ"; exit 1; }
          # shellcheck disable=SC2029
          ssh "$SSH_USER@$HOST" "mkdir -p $DIR/site"
          scp -p deploy/staging/compose.yaml deploy/staging/Caddyfile deploy/staging/.env "$SSH_USER@$HOST:$DIR/"
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_PULL_TOKEN" | ssh "$SSH_USER@$HOST" "docker login ghcr.io -u $GHCR_USER --password-stdin \
            && cd $DIR && docker compose pull && docker compose up -d --wait && docker compose ps"
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ vars.STAGING_GHCR_USER }}

# Kiểm tĩnh manifest Kubernetes và cấu hình giám sát (#36). Không cần cluster.
name: K8s

on:
  pull_request:
    paths:
      - deploy/**
      - .github/workflows/k8s.yml
  push:
    branches: [develop]
    paths:
      - deploy/**
      - .github/workflows/k8s.yml

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Overlay sinh Secret từ .env (gitignore): dùng file mẫu để build.
      - name: File .env mẫu
        run: |
          for f in $(find deploy/k8s/overlays -name .env.example); do cp "$f" "${f%.example}"; done

      # kubectl (có Kustomize) và yq có sẵn trên ubuntu-latest.
      - name: Build, kubeconform, kiểm tham chiếu
        run: |
          for o in local vps; do
            echo "== $o"
            kubectl kustomize "deploy/k8s/overlays/$o" > "/tmp/$o.yaml"
            docker run --rm -v /tmp:/w ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary -kubernetes-version 1.34.0 "/w/$o.yaml"
            yq ea -o=json -I=0 '[.]' "/tmp/$o.yaml" | node deploy/k8s/check.mjs
          done

      - name: Cấu hình Prometheus và test luật cảnh báo
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/m" --entrypoint sh prom/prometheus:v3.5.0 -c \
            'cp /m/k8s/prometheus.yml /m/rules/alerts.yml /tmp/ && promtool check config /tmp/prometheus.yml && promtool test rules /m/rules/alerts.test.yml'

      - name: Dashboard là JSON hợp lệ
        run: node -e "JSON.parse(require('fs').readFileSync('deploy/monitoring/dashboards/commerio.json', 'utf8'))"

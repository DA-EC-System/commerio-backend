# Hạ tầng cho máy dev. Ứng dụng chạy bằng `npm run dev` trên máy, không chạy trong compose.
# Chạy: npm run infra:up    Thêm Prometheus + Grafana: docker compose -f deploy/compose.yaml --profile monitoring up -d
name: commerio

services:
  postgres:
    # Ảnh postgres 18 có sẵn pgvector, cần cho module assistant.
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: commerio
      POSTGRES_PASSWORD: commerio
      POSTGRES_DB: commerio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerio -d commerio"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"

  kafka:
    # Một node KRaft, đủ cho dev. Máy dev kết nối localhost:9092.
    # Đặt bất kỳ biến KAFKA_* nào thì ảnh bỏ cấu hình mặc định, nên phải khai đủ KRaft ở đây.
    image: apache/kafka:4.1.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topic mới có 3 partition (Documents/21 D6): key = aggregateId giữ thứ tự theo đơn, tồn.
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  mailpit:
    # Hộp thư giả cho máy dev (#7): app gửi SMTP tới localhost:1025 (SMTP_URL=smtp://localhost:1025),
    # xem thư ở http://localhost:8025. Không gửi ra ngoài.
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [monitoring]
    # Cùng datasource và dashboard "Commerio" với Kubernetes (deploy/monitoring). Máy dev đăng nhập admin/admin.
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3030:3000"

volumes:
  pgdata:

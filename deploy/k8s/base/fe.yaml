# FE: image của repo FE (Dockerfile ở gốc repo đó), dist/ do Caddy trong image phục vụ ở cổng 8080.
# Hai bản cùng commit: fe gọi backend thật (ở /), fe-mock chạy MSW (ở /mock/).
# Image "commerio-fe" được overlay đổi tên và tag. Caddy của cụm chuyển / sang Service fe (cùng origin với /api, V38).
# Filesystem chỉ đọc: Caddy trong image không ghi gì ngoài /tmp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe
  labels:
    app.kubernetes.io/name: fe
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fe
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: fe
          image: commerio-fe
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fe
spec:
  selector:
    app.kubernetes.io/name: fe
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Bản FE chạy MSW (dữ liệu giả), build với BASE_PATH=/mock/. Caddy của cụm chuyển /mock/* vào đây, bỏ tiền tố.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe-mock
  labels:
    app.kubernetes.io/name: fe-mock
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fe-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fe-mock
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: fe-mock
          image: commerio-fe-mock
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fe-mock
spec:
  selector:
    app.kubernetes.io/name: fe-mock
  ports:
    - name: http
      port: 80
      targetPort: http

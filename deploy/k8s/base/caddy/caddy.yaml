# Cổng vào duy nhất (thay Ingress; k3s cài với --disable traefik): FE ở /, API ở /api, SSE tới realtime.
# Overlay vps đổi /data sang PVC để giữ chứng chỉ HTTPS.
apiVersion: v1
kind: Service
metadata:
  name: caddy
spec:
  type: LoadBalancer
  # Giữ IP khách để X-Forwarded-For đúng, rate limit đếm theo người (TRUST_PROXY_HOPS=1).
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: caddy
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  labels:
    app.kubernetes.io/name: caddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy
    spec:
      enableServiceLinks: false
      containers:
        - name: caddy
          image: caddy:2.10
          envFrom:
            - configMapRef:
                name: caddy-site
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: caddyfile
          configMap:
            name: caddyfile
        - name: data
          emptyDir: {}

# Kafka một node KRaft (#37). Service headless: tên "kafka" trỏ thẳng pod.
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  clusterIP: None
  # Kafka quảng bá kafka:9092; tên phải phân giải được cả lúc pod chưa Ready (readiness gọi qua tên này).
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      # Ảnh apache/kafka đổi mọi biến KAFKA_* thành cấu hình: không để Kubernetes tiêm KAFKA_PORT, KAFKA_SERVICE_HOST.
      enableServiceLinks: false
      # Ảnh chạy user appuser (uid 1000): volume ghi được.
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:4.1.0
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_HEAP_OPTS
              value: -Xmx512m -Xms512m
            # Có biến KAFKA_* thì ảnh bỏ cấu hình mặc định; thiếu dòng này dữ liệu nằm ở /tmp, mất khi pod khởi động lại.
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
          ports:
            - name: broker
              containerPort: 9092
          # Chỉ kiểm cổng: kafka-broker-api-versions.sh khởi động một JVM mỗi lần (~2 s, 1,4 nhân), 10 s một lần
          # là ~0,3 nhân thường trực trên VPS 2 nhân (dashboard "Máy VPS", 20/10/2026). Cổng có thể mở trước khi
          # broker nhận yêu cầu được; worker, realtime tự nối lại nếu gọi sớm.
          readinessProbe:
            tcpSocket:
              port: broker
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi

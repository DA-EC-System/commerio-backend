  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-ui
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: test-ui
          image: commerio-test-ui
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 48Mi
      volumes:
        - name: tmp
          emptyDir: {}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      enableServiceLinks: false
      # Dừng relay outbox có thể chờ tới 30 giây (messageTimeoutMs).
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: worker
          image: commerio-backend
          command: ["node", "src/entrypoints/worker.ts"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-env
          ports:
            - name: metrics
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: realtime
spec:
  selector:
    app.kubernetes.io/name: realtime
  ports:
    - name: http
      port: 3002
      targetPort: http

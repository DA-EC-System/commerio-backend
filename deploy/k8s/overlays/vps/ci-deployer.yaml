# Quyền của CI khi deploy (ci-deploy/commerio-deploy.sh): get/patch 4 Deployment và xem rollout,
# không đọc Secret, không tạo hay xoá gì. RBAC không giới hạn được patch chỉ ở trường image: token này sửa được
# cả pod template. Hai lớp chặn: token chỉ nằm trong kubeconfig của ci-deploy, tài khoản không có shell và khoá SSH
# chỉ chạy được commerio-deploy (set image với tag đã kiểm); namespace bật Pod Security baseline (base/namespace.yaml)
# nên pod sinh từ template có privileged hay hostPath bị từ chối lúc tạo (Deployment vẫn nhận patch, kèm cảnh báo).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["api", "worker", "realtime", "fe"]
    verbs: ["get", "patch"]
  # rollout status theo dõi Deployment và ReplicaSet của nó.
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
subjects:
  - kind: ServiceAccount
    name: ci-deployer

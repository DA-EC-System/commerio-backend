# Quyền của CI khi deploy (ci-deploy/commerio-deploy.sh): đổi image và số bản sao của worker và 10 Deployment
# blue-green, đổi selector của 5 Service (chuyển màu), xem rollout; không đọc Secret, không tạo hay xoá gì. RBAC không giới hạn được patch chỉ ở trường image: token này sửa được
# cả pod template. Hai lớp chặn: token chỉ nằm trong kubeconfig của ci-deploy, tài khoản không có shell và khoá SSH
# chỉ chạy được commerio-deploy (set image với tag đã kiểm); namespace bật Pod Security baseline (base/namespace.yaml)
# nên pod sinh từ template có privileged hay hostPath bị từ chối lúc tạo (Deployment vẫn nhận patch, kèm cảnh báo).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["worker", "api-blue", "api-green", "realtime-blue", "realtime-green", "fe-blue", "fe-green", "fe-mock-blue", "fe-mock-green", "test-ui-blue", "test-ui-green"]
    verbs: ["get", "patch"]
  # kubectl scale đi qua subresource scale.
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["api-blue", "api-green", "realtime-blue", "realtime-green", "fe-blue", "fe-green", "fe-mock-blue", "fe-mock-green", "test-ui-blue", "test-ui-green"]
    verbs: ["get", "patch", "update"]
  # Chuyển màu: thêm hoặc đổi nhãn color trong selector của Service.
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["api", "realtime", "fe", "fe-mock", "test-ui"]
    verbs: ["get", "patch"]
  # rollout status theo dõi Deployment và ReplicaSet của nó.
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
subjects:
  - kind: ServiceAccount
    name: ci-deployer

# Cảnh báo cơ bản (#36). Xem trạng thái ở trang /alerts của Prometheus; chưa gửi đi đâu (chưa có Alertmanager).
# Test: alerts.test.yml cùng thư mục.
groups:
  - name: commerio
    rules:
      # up == 0: Prometheus thấy pod nhưng /metrics không trả lời. absent(): không còn pod nào (vd scale về 0),
      # khi đó target biến mất chứ không có mẫu up == 0.
      - alert: CommerioProcessDown
        expr: |
          up{job="commerio"} == 0
          or absent(up{job="commerio",process="api"})
          or absent(up{job="commerio",process="worker"})
          or absent(up{job="commerio",process="realtime"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Tiến trình {{ $labels.process }} không trả /metrics hoặc không có pod nào chạy

      - alert: CommerioHighErrorRate
        expr: |
          sum(rate(http_request_duration_seconds_count{job="commerio",route!="/health",status=~"5.."}[5m]))
            / sum(rate(http_request_duration_seconds_count{job="commerio",route!="/health"}[5m]))
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Hơn 5% yêu cầu tới api trả 5xx trong 5 phút

      # Gauge trả NaN khi worker không đọc được DB, nên luật này im lặng đúng lúc DB lỗi.
      - alert: CommerioOutboxLagging
        expr: outbox_oldest_pending_age_seconds{job="commerio"} > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Sự kiện outbox chờ gửi lên Kafka quá 60 giây

      # Counter không có sẵn nhãn: lần vào DLQ đầu tiên của một topic/consumer tạo chuỗi mới ở 1, increase() ra 0,
      # nên thêm vế "chuỗi chưa có 10 phút trước". Ngay sau khi Prometheus khởi động lại, vế này báo nhầm một lần.
      - alert: CommerioDeadLettered
        expr: |
          increase(outbox_dead_lettered_total{job="commerio"}[10m]) > 0
          or (outbox_dead_lettered_total{job="commerio"} unless outbox_dead_lettered_total{job="commerio"} offset 10m)
        labels:
          severity: warning
        annotations:
          summary: Có sự kiện bị chuyển sang DLQ trong 10 phút qua

# Test luật cảnh báo: docker run --rm -v "$PWD/deploy/monitoring/rules:/r" --entrypoint promtool prom/prometheus:v3.5.0 test rules /r/alerts.test.yml
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # Ba tiến trình đều chạy: không cảnh báo.
  - interval: 1m
    input_series:
      - series: 'up{job="commerio",process="api"}'
        values: '1x10'
      - series: 'up{job="commerio",process="worker"}'
        values: '1x10'
      - series: 'up{job="commerio",process="realtime"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: CommerioProcessDown

  # Prometheus thấy worker nhưng /metrics không trả lời (up == 0).
  - interval: 1m
    input_series:
      - series: 'up{job="commerio",process="api"}'
        values: '1x10'
      - series: 'up{job="commerio",process="worker"}'
        values: '1 1 0x10'
      - series: 'up{job="commerio",process="realtime"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: CommerioProcessDown
      - eval_time: 5m
        alertname: CommerioProcessDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: commerio
              process: worker
            exp_annotations:
              summary: Tiến trình worker không trả /metrics hoặc không có pod nào chạy

  # kubectl scale deploy/worker --replicas=0: target biến mất, không có mẫu up == 0.
  - interval: 1m
    input_series:
      - series: 'up{job="commerio",process="api"}'
        values: '1x10'
      - series: 'up{job="commerio",process="realtime"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: CommerioProcessDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: commerio
              process: worker
            exp_annotations:
              summary: Tiến trình worker không trả /metrics hoặc không có pod nào chạy

  # 10% yêu cầu trả 5xx trong 5 phút: bắn. Yêu cầu /health không tính.
  - interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_count{job="commerio",process="api",method="GET",route="/api/v1/x",status="200"}'
        values: '0+90x20'
      - series: 'http_request_duration_seconds_count{job="commerio",process="api",method="GET",route="/api/v1/x",status="500"}'
        values: '0+10x20'
      - series: 'http_request_duration_seconds_count{job="commerio",process="api",method="GET",route="/health",status="200"}'
        values: '0+1000x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: CommerioHighErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Hơn 5% yêu cầu tới api trả 5xx trong 5 phút

  # 1% lỗi: không bắn.
  - interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_count{job="commerio",process="api",method="GET",route="/api/v1/x",status="200"}'
        values: '0+99x20'
      - series: 'http_request_duration_seconds_count{job="commerio",process="api",method="GET",route="/api/v1/x",status="500"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: CommerioHighErrorRate

  # Outbox: sự kiện cũ nhất chờ hơn 60 giây suốt 5 phút thì bắn; dưới 60 giây thì không.
  - interval: 1m
    input_series:
      - series: 'outbox_oldest_pending_age_seconds{job="commerio",process="worker"}'
        values: '0 30 70x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: CommerioOutboxLagging
      - eval_time: 8m
        alertname: CommerioOutboxLagging
        exp_alerts:
          - exp_labels:
              severity: warning
              job: commerio
              process: worker
            exp_annotations:
              summary: Sự kiện outbox chờ gửi lên Kafka quá 60 giây
  - interval: 1m
    input_series:
      - series: 'outbox_oldest_pending_age_seconds{job="commerio",process="worker"}'
        values: '0 30 50x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: CommerioOutboxLagging

  # DLQ: counter chưa có nhãn trước, chuỗi xuất hiện lần đầu ở 1 vẫn phải bắn.
  - interval: 1m
    input_series:
      - series: 'outbox_dead_lettered_total{job="commerio",process="worker",topic="commerio.sales",consumer="report"}'
        values: '_x5 1x20'
    alert_rule_test:
      - eval_time: 7m
        alertname: CommerioDeadLettered
        exp_alerts:
          - exp_labels:
              severity: warning
              job: commerio
              process: worker
              topic: commerio.sales
              consumer: report
            exp_annotations:
              summary: Có sự kiện bị chuyển sang DLQ trong 10 phút qua
      # Quá 10 phút không thêm sự kiện nào: thôi bắn.
      - eval_time: 20m
        alertname: CommerioDeadLettered

  # DLQ tăng thêm trên chuỗi đã có.
  - interval: 1m
    input_series:
      - series: 'outbox_dead_lettered_total{job="commerio",process="worker",topic="commerio.sales",consumer="report"}'
        values: '2x15 3x10'
    alert_rule_test:
      - eval_time: 14m
        alertname: CommerioDeadLettered
      - eval_time: 18m
        alertname: CommerioDeadLettered
        exp_alerts:
          - exp_labels:
              severity: warning
              job: commerio
              process: worker
              topic: commerio.sales
              consumer: report
            exp_annotations:
              summary: Có sự kiện bị chuyển sang DLQ trong 10 phút qua

  # Máy VPS: CPU idle 10% (dùng 90%) suốt 20 phút thì báo; RAM còn 10%; ổ dùng 90%.
  - interval: 1m
    input_series:
      - series: 'node_cpu_seconds_total{job="node",cpu="0",mode="idle"}'
        values: '0+6x30'
      - series: 'node_memory_MemAvailable_bytes{job="node"}'
        values: '400x30'
      - series: 'node_memory_MemTotal_bytes{job="node"}'
        values: '4000x30'
      - series: 'node_filesystem_avail_bytes{job="node",mountpoint="/",fstype="ext4"}'
        values: '10x30'
      - series: 'node_filesystem_size_bytes{job="node",mountpoint="/",fstype="ext4"}'
        values: '100x30'
      - series: 'up{job="node"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: VpsCpuHigh
      - eval_time: 25m
        alertname: VpsCpuHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: CPU máy VPS trên 80% suốt 15 phút
      - eval_time: 15m
        alertname: VpsMemoryLow
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
            exp_annotations:
              summary: RAM còn trống của máy VPS dưới 15% suốt 10 phút
      - eval_time: 15m
        alertname: VpsDiskFull
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              mountpoint: /
              fstype: ext4
            exp_annotations:
              summary: Ổ / của máy VPS đã dùng hơn 85% (k3s bắt đầu xoá image ở mức này)
      - eval_time: 15m
        alertname: VpsNodeExporterDown

  # Máy rảnh: CPU idle gần 100%, RAM còn 50%, ổ dùng 30%, node-exporter mất 6 phút thì chỉ báo VpsNodeExporterDown.
  - interval: 1m
    input_series:
      - series: 'node_cpu_seconds_total{job="node",cpu="0",mode="idle"}'
        values: '0+58x30'
      - series: 'node_memory_MemAvailable_bytes{job="node"}'
        values: '2000x30'
      - series: 'node_memory_MemTotal_bytes{job="node"}'
        values: '4000x30'
      - series: 'node_filesystem_avail_bytes{job="node",mountpoint="/",fstype="ext4"}'
        values: '70x30'
      - series: 'node_filesystem_size_bytes{job="node",mountpoint="/",fstype="ext4"}'
        values: '100x30'
      - series: 'up{job="node"}'
        values: '1x10 0x20'
    alert_rule_test:
      - eval_time: 25m
        alertname: VpsCpuHigh
      - eval_time: 25m
        alertname: VpsMemoryLow
      - eval_time: 25m
        alertname: VpsDiskFull
      - eval_time: 18m
        alertname: VpsNodeExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
            exp_annotations:
              summary: Không lấy được số liệu máy VPS (dịch vụ prometheus-node-exporter)

  # Thư OTP lỗi vĩnh viễn lần đầu (chuỗi mới ở 1): bắn.
  - interval: 1m
    input_series:
      - series: 'mail_send_total{job="commerio",process="worker",template="invitation_otp",result="ok"}'
        values: '0+1x20'
      - series: 'mail_send_total{job="commerio",process="worker",template="invitation_otp",result="permanent"}'
        values: '_x5 1x15'
    alert_rule_test:
      - eval_time: 8m
        alertname: CommerioMailPermanentFailure
        exp_alerts:
          - exp_labels:
              severity: warning
              job: commerio
              process: worker
              template: invitation_otp
              result: permanent
            exp_annotations:
              summary: Gửi thư mẫu invitation_otp lỗi vĩnh viễn trong 15 phút qua

  # Lỗi vĩnh viễn tăng thêm sau khi chuỗi đã có từ lâu: bắn; 15 phút không tăng: thôi.
  - interval: 1m
    input_series:
      - series: 'mail_send_total{job="commerio",process="worker",template="invitation_otp",result="permanent"}'
        values: '1x20 2x40'
    alert_rule_test:
      - eval_time: 18m
        alertname: CommerioMailPermanentFailure
      - eval_time: 25m
        alertname: CommerioMailPermanentFailure
        exp_alerts:
          - exp_labels:
              severity: warning
              job: commerio
              process: worker
              template: invitation_otp
              result: permanent
            exp_annotations:
              summary: Gửi thư mẫu invitation_otp lỗi vĩnh viễn trong 15 phút qua
      - eval_time: 45m
        alertname: CommerioMailPermanentFailure

  # Chỉ có thư gửi được: không bắn.
  - interval: 1m
    input_series:
      - series: 'mail_send_total{job="commerio",process="worker",template="invitation_otp",result="ok"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: CommerioMailPermanentFailure

# Prometheus trong Kubernetes: tìm pod cùng namespace, lấy /metrics ở cổng tên "metrics" (deploy/k8s/base/app.yaml).
# Nhãn job="commerio", process=<api|worker|realtime> giống deploy/monitoring/prometheus.yml của máy dev, nên một dashboard dùng cho cả hai.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: commerio
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      # Pod bị evict vẫn còn object (pha Failed): bỏ, không thì up == 0 mãi.
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Succeeded|Failed
        action: drop
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: process
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

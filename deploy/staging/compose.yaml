# Staging (#37, Documents/21 D12, V35–V38): ba tiến trình cùng một image, Redis, Kafka, Caddy.
# Caddy phục vụ FE ở / và API ở /api trên cùng origin, nên không cần CORS và cookie refresh SameSite=Strict vẫn chạy.
# Database là Supabase (hoặc DB Docker trên máy khi thử), không chạy PostgreSQL ở đây.
# Chỉ Caddy mở cổng ra máy chủ; các cổng còn lại chỉ trong mạng nội bộ của compose.
# Chạy: docker compose -f deploy/staging/compose.yaml up -d --wait   (biến lấy từ deploy/staging/.env, xem README.md cùng thư mục)
name: commerio-staging

x-app: &app
  image: ${IMAGE:-ghcr.io/da-ec-system/commerio-backend}:${IMAGE_TAG:-develop}
  env_file: .env
  environment:
    NODE_ENV: production
    # Đứng sau một tầng Caddy: req.ip là IP khách, rate limit đếm đúng người.
    TRUST_PROXY_HOPS: "1"
    KAFKA_BROKERS: kafka:9092
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"

# Ảnh node:24-slim không có curl: kiểm /health bằng fetch của Node.
x-health: &health
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

services:
  api:
    <<: *app
    healthcheck:
      <<: *health
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

  # worker (relay outbox, #38) và realtime (consumer SSE, #33) nối Kafka lúc khởi động.
  worker:
    <<: *app
    command: ["node", "src/entrypoints/worker.ts"]
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

  realtime:
    <<: *app
    command: ["node", "src/entrypoints/realtime.ts"]
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

  redis:
    image: redis:8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  kafka:
    # Như deploy/compose.yaml nhưng quảng bá tên kafka:9092 cho container khác, không mở ra máy chủ.
    image: apache/kafka:4.1.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
      # Có biến KAFKA_* thì ảnh bỏ cấu hình mặc định; thiếu dòng này dữ liệu nằm ở /tmp, mất khi tạo lại container.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    environment:
      # VPS: tên miền (Caddy tự xin chứng chỉ HTTPS). Trên máy: :80, mở bằng http://localhost:<HTTP_PORT>.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${FE_DIST:-./site}:/srv/fe:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  kafkadata:
  caddydata:
  caddyconfig:
